name: Mirror ELK Images

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Какой образ зеркалим? (например: filebeat)'
        required: true
        default: 'filebeat'
      image_tag:
        description: 'Тег образа (например: 8.19.10)'
        required: true
        default: '8.19.10'

permissions:
  contents: read
  packages: write

jobs:
  push_to_ghcr:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_TOKEN }} 

      - name: Pull, Tag and Push
        run: |
          # 1. Формируем полные имена
          SOURCE="docker.elastic.co/${{ github.event.inputs.image_name }}/${{ github.event.inputs.image_name }}:${{ github.event.inputs.image_tag }}"
          TARGET="ghcr.io/${{ github.actor }}/${{ github.event.inputs.image_name }}:${{ github.event.inputs.image_tag }}"
          
          # 2. Выполняем перенос
          echo "Mirroring $SOURCE to $TARGET..."
          docker pull $SOURCE
          docker tag $SOURCE $TARGET
          docker push $TARGETname: 
