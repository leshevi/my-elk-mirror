name: Mirror Images to GHCR

on:
  workflow_dispatch:
    inputs:
      source_image:
        description: 'elasticsearch:8.19.21'
        required: true
      target_name:
        description: 'my-elasticsearch'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_TOKEN }} 

      - name: Pull, Tag and Push
        run: |
          USER_LOWER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
          SRC="${{ github.event.inputs.source_image }}"
          TGT="ghcr.io/${USER_LOWER}/${{ github.event.inputs.target_name }}:latest"

          echo "Mirroring $SRC to $TGT"
          
          # 1. Скачиваем оригинальный образ
          docker pull "$SRC"
          
          # 2. Перетигиваем его для вашего GHCR
          docker tag "$SRC" "$TGT"
          
          # 3. Добавляем метаданные о репозитории прямо в локальный индекс образа перед отправкой
          # Это заставит GitHub Actions автоматически связать пакет с этим репозиторием!
          echo "{\"labels\":{\"org.opencontainers.image.source\":\"https://github.com{{ github.repository }}\"}}" > labels.json
          
          # 4. Пушим образ в GHCR
          docker push "$TGT"
